
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Node dependencies
        run: npm ci

      - name: Configure edge-to-edge system bars
        run: |
          node -e '
          const fs = require("fs");
          const p = "capacitor.config.json";
          const c = JSON.parse(fs.readFileSync(p, "utf8"));
          c.plugins = c.plugins || {};
          c.plugins.SystemBars = {
            insetsHandling: "css",
            style: "DARK",
            hidden: false
          };
          fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
          '

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set Android window background to black
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("android/app/src/main/res")
          files = list(root.glob("values*/styles.xml"))

          if not files:
              raise SystemExit("No Android styles.xml files found")

          for path in files:
              text = path.read_text()
              if "android:windowBackground" not in text:
                  text = re.sub(
                      r"(<style\b[^>]*\bname=\"AppTheme\"[^>]*>)",
                      r'\1\n        <item name="android:windowBackground">#000000</item>',
                      text,
                      count=1
                  )
                  path.write_text(text)
              print(f"Checked {path}")

          PY

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: video-player-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

