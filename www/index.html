<!doctype html>
<!--
  Video Player — ambient video player for Android (Capacitor).

  The ambient-light engine (js/ambilight.js) is ported from youtube-ambilight by Wessel Kroos
  (MIT licence) — see THIRD_PARTY_NOTICES.md in the repository root.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Video Player</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/player.css">
<link rel="stylesheet" href="css/editors.css">
<link rel="stylesheet" href="css/sheet.css">
<link rel="stylesheet" href="css/gameboy.css">
</head>
<body>
<main class="app">
  <section class="stage" id="stage" aria-label="Video player">

    <!-- ===== Display: the window the video is shown in ===== -->
    <div class="video-wrap" id="videoWrap">
      <div class="layer ambient-layer" id="ambientLayer">
        <canvas id="stretchCv" aria-hidden="true"></canvas>
        <video id="extVideo" muted playsinline preload="auto" aria-hidden="true"></video>
        <div class="ambi" id="ambi" aria-hidden="true">
          <div class="ambi-filter" id="ambiFilter"><div class="ambi-proj" id="ambiProj"></div></div>
          <div class="ambi-noise" id="ambiNoise"></div>
        </div>
        <canvas class="mir" id="mirTop" aria-hidden="true"></canvas>
        <canvas class="mir" id="mirTopB" aria-hidden="true"></canvas>
        <canvas class="mir" id="mirBottom" aria-hidden="true"></canvas>
        <canvas class="mir" id="mirBottomB" aria-hidden="true"></canvas>
        <canvas class="mir" id="mirSide" aria-hidden="true"></canvas>
        <canvas class="mir" id="mirSideB" aria-hidden="true"></canvas>
      </div>

      <div class="layer fg-layer" id="fgLayer">
        <div class="fg-clip" id="fgClip"><video id="video" playsinline preload="metadata"></video></div>
      </div>
      <div class="video-vignette"></div>
      <i class="corner l" aria-hidden="true"></i><i class="corner r" aria-hidden="true"></i>

      <!-- touch surface: tap = play, double-tap = seek, pinch = zoom -->
      <div class="gestures" id="gestures"></div>
      <div class="flash" id="flash" aria-hidden="true"></div>

      <!-- crop editor: two vertical + two horizontal cut lines -->
      <div class="crop-editor hidden" id="cropEditor" aria-label="Crop editor">
        <div class="crop-shade" id="shT"></div><div class="crop-shade" id="shB"></div>
        <div class="crop-shade" id="shL"></div><div class="crop-shade" id="shR"></div>
        <div class="crop-box" id="cropBox"></div>
        <div class="crop-line h" id="lineT" data-edge="t" title="Drag to cut the top"></div>
        <div class="crop-line h" id="lineB" data-edge="b" title="Drag to cut the bottom"></div>
        <div class="crop-line v" id="lineL" data-edge="l" title="Drag to cut the left"></div>
        <div class="crop-line v" id="lineR" data-edge="r" title="Drag to cut the right"></div>
        <div class="editor-bar">
          <button class="pill" id="edAuto" type="button">Auto</button>
          <button class="pill" id="edReset" type="button">Reset</button>
          <button class="pill accent" id="edDone" type="button">Done</button>
        </div>
      </div>

      <!-- frame editor: move / zoom the video, resize the display -->
      <div class="adjust-editor hidden" id="adjustEditor" aria-label="Frame editor">
        <div class="adj-box" id="adjBox"></div>
        <div class="adj-cross" aria-hidden="true"></div>
        <div class="adj-hint" id="adjHint">Drag to move &middot; pinch to zoom</div>
        <div class="editor-bar">
          <button class="pill" id="adjFit" type="button">Fit</button>
          <button class="pill" id="adjFill" type="button">Fill</button>
          <button class="pill" id="adjReset" type="button">Reset</button>
          <button class="pill accent" id="adjDone" type="button">Done</button>
        </div>
        <div class="disp-handle" id="dispHandle" role="slider" aria-label="Display height" title="Drag to resize the display"><span></span></div>
      </div>

      <div class="upload-prompt" id="uploadPrompt">
        <div class="home-head">
          <h1 id="greeting">Good afternoon!</h1>
          <p>What are we watching?</p>
        </div>
        <div class="home-grid">
          <button class="home-card yellow" id="pickVideo" type="button">
            <span class="hc-title">Open video</span><span class="hc-sub">From your phone</span>
            <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M20 10v44l38-22z" fill="currentColor"/></svg>
          </button>
          <div class="home-col">
            <button class="home-card dark" id="pickExt" type="button"><span class="hc-title">Extended</span><span class="hc-sub">Background clip</span></button>
            <button class="home-card white" id="pickSrt" type="button"><span class="hc-title">Subtitles</span><span class="hc-sub">Add an .srt file</span></button>
          </div>
        </div>
      </div>

      <button class="play-overlay" id="bigPlay" type="button" aria-label="Play video"></button>
    </div>

    <!-- ===== Subtitles ===== -->
    <section class="text-section" id="subs" aria-label="Subtitles" aria-live="polite">
      <h2 id="subMain" dir="auto"></h2>
      <p class="description" id="description" dir="auto"></p>
      <button class="chip hidden" id="addSrt" type="button">＋ Add subtitles (SRT)</button>
    </section>

    <!-- ===== Controls: a little game pad. D-pad = skip + speed, reel = play / pause, round keys = player buttons ===== -->
    <section class="controls" id="controls" aria-label="Playback controls">
      <i class="skin" id="skin" aria-hidden="true"></i>

      <div class="utility-row">
        <button class="chip hidden" id="viewBadge" type="button" title="Reset zoom and position"></button>
      </div>

      <div class="seek-row">
        <span class="time" id="currentTime">0:00</span>
        <input id="seek" class="range" type="range" min="0" max="1000" value="0" aria-label="Seek video">
        <span class="time" id="duration">0:00</span>
      </div>

      <div class="wheel" id="wheel">
        <svg class="wheel-defs" width="0" height="0" aria-hidden="true"><defs><linearGradient id="petalGrad" gradientUnits="userSpaceOnUse" x1="58.6" y1="58.6" x2="341.4" y2="341.4"><stop offset="0" stop-color="#eae2d6"/><stop offset="1" stop-color="#d4cdf0"/></linearGradient></defs></svg>
        <button class="pad-btn petal p-n" id="speedUp" type="button" aria-label="Faster" title="Faster">
          <svg viewBox="0 0 400 400" aria-hidden="true"><g class="pt"><path class="body" d="M213.31 131.28L251.90 38.12A170.00 170.00 0 0 0 148.10 38.12L186.69 131.28A70.00 70.00 0 0 1 213.31 131.28Z" stroke-width="24.00"/><g class="ico" transform="translate(200.0 62.0) scale(1.75) translate(-12 -12)"><path class="fillink" d="M12 6.2 18 16H6z"/></g><text id="speedLabel" class="lab" x="200.0" y="98.0" text-anchor="middle">1×</text></g></svg>
        </button>
        <button class="pad-btn petal p-ne" id="fsToggle" type="button" aria-label="Fullscreen">
          <svg viewBox="0 0 400 400" aria-hidden="true"><g class="pt"><path class="body" d="M258.01 160.82L351.17 122.23A170.00 170.00 0 0 0 277.77 48.83L239.18 141.99A70.00 70.00 0 0 1 258.01 160.82Z" stroke-width="24.00"/><g class="ico" transform="translate(290.5 109.5) scale(1.75) translate(-12 -12)"><path id="fsPath" d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/></g></g></svg>
        </button>
        <button class="pad-btn petal p-e" id="forward" type="button" aria-label="Forward 10 seconds" title="Forward (hold to keep going)">
          <svg viewBox="0 0 400 400" aria-hidden="true"><g class="pt"><path class="body" d="M268.72 213.31L361.88 251.90A170.00 170.00 0 0 0 361.88 148.10L268.72 186.69A70.00 70.00 0 0 1 268.72 213.31Z" stroke-width="24.00"/><g class="ico" transform="translate(328.0 190.0) scale(1.75) translate(-12 -12)"><path class="fillink" d="M7.5 5.5 17.5 12 7.5 18.5z"/></g><text id="fwdLabel" class="lab" x="328.0" y="226.0" text-anchor="middle">10</text></g></svg>
        </button>
        <button class="pad-btn petal p-se" id="loopToggle" type="button" aria-label="Loop video" aria-pressed="false">
          <svg viewBox="0 0 400 400" aria-hidden="true"><g class="pt"><path class="body" d="M239.18 258.01L277.77 351.17A170.00 170.00 0 0 0 351.17 277.77L258.01 239.18A70.00 70.00 0 0 1 239.18 258.01Z" stroke-width="24.00"/><g class="ico" transform="translate(290.5 290.5) scale(1.75) translate(-12 -12)"><path d="M17 2.5 20.5 6 17 9.5M3.5 11V9.5A3.5 3.5 0 0 1 7 6h13.5M7 21.5 3.5 18 7 14.5M20.5 13v1.5A3.5 3.5 0 0 1 17 18H3.5"/></g></g></svg>
        </button>
        <button class="pad-btn petal p-s" id="speedDown" type="button" aria-label="Slower" title="Slower">
          <svg viewBox="0 0 400 400" aria-hidden="true"><g class="pt"><path class="body" d="M186.69 268.72L148.10 361.88A170.00 170.00 0 0 0 251.90 361.88L213.31 268.72A70.00 70.00 0 0 1 186.69 268.72Z" stroke-width="24.00"/><g class="ico" transform="translate(200.0 328.0) scale(1.75) translate(-12 -12)"><path class="fillink" d="M12 17.8 6 8h12z"/></g></g></svg>
        </button>
        <button class="pad-btn petal p-sw" id="adjustToggle" type="button" aria-label="Move and zoom video" aria-pressed="false">
          <svg viewBox="0 0 400 400" aria-hidden="true"><g class="pt"><path class="body" d="M141.99 239.18L48.83 277.77A170.00 170.00 0 0 0 122.23 351.17L160.82 258.01A70.00 70.00 0 0 1 141.99 239.18Z" stroke-width="24.00"/><g class="ico" transform="translate(109.5 290.5) scale(1.75) translate(-12 -12)"><path d="M12 3v18M3 12h18M12 3 9 6M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></g></g></svg>
        </button>
        <button class="pad-btn petal p-w" id="backward" type="button" aria-label="Back 10 seconds" title="Back (hold to keep going)">
          <svg viewBox="0 0 400 400" aria-hidden="true"><g class="pt"><path class="body" d="M131.28 186.69L38.12 148.10A170.00 170.00 0 0 0 38.12 251.90L131.28 213.31A70.00 70.00 0 0 1 131.28 186.69Z" stroke-width="24.00"/><g class="ico" transform="translate(72.0 190.0) scale(1.75) translate(-12 -12)"><path class="fillink" d="M16.5 5.5 6.5 12 16.5 18.5z"/></g><text id="backLabel" class="lab" x="72.0" y="226.0" text-anchor="middle">10</text></g></svg>
        </button>
        <button class="pad-btn petal p-nw" id="settingsToggle" type="button" aria-label="Settings" aria-expanded="false">
          <svg viewBox="0 0 400 400" aria-hidden="true"><g class="pt"><path class="body" d="M160.82 141.99L122.23 48.83A170.00 170.00 0 0 0 48.83 122.23L141.99 160.82A70.00 70.00 0 0 1 160.82 141.99Z" stroke-width="24.00"/><g class="ico" transform="translate(109.5 109.5) scale(1.75) translate(-12 -12)"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></g></g></svg>
        </button>
        <button class="reel-btn" id="playPause" type="button" aria-label="Play video">
          <svg class="reel" viewBox="0 0 400 400" aria-hidden="true">
            <circle class="hub" cx="200" cy="200" r="52"/>
            <g transform="translate(200 200) scale(3.3)"><path class="g-play" d="M-3.9 -5.4L5.4 0L-3.9 5.4Z"/><g class="g-pause"><rect x="-5.2" y="-6" width="3.6" height="12" rx="1.5"/><rect x="1.6" y="-6" width="3.6" height="12" rx="1.5"/></g></g>
          </svg>
        </button>
      </div>
    </section>

    <!-- ===== Settings sheet ===== -->
    <aside class="sheet" id="sheet" aria-label="Settings" aria-hidden="true">
      <div class="sheet-grab" aria-hidden="true"></div>
      <header class="sheet-head">
        <nav class="tabs" id="tabs" role="tablist" aria-label="Settings sections">
          <button role="tab" type="button" data-tab="top" aria-selected="false">Top</button>
          <button role="tab" type="button" data-tab="video" aria-selected="true">Video</button>
          <button role="tab" type="button" data-tab="bottom" aria-selected="false">Bottom</button>
          <button role="tab" type="button" data-tab="presets" aria-selected="false">Presets</button>
          <button role="tab" type="button" data-tab="playback" aria-selected="false">Playback</button>
          <button role="tab" type="button" data-tab="look" aria-selected="false">Look</button>
          <button role="tab" type="button" data-tab="media" aria-selected="false">Media</button>
        </nav>
        <button class="icon-btn small" id="sheetClose" type="button" aria-label="Close settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div class="sheet-body" id="sheetBody">
        <section class="panel hidden" data-panel="top" role="tabpanel"></section>
        <section class="panel" data-panel="video" role="tabpanel"></section>
        <section class="panel hidden" data-panel="bottom" role="tabpanel"></section>
        <section class="panel hidden" data-panel="presets" role="tabpanel"></section>
        <section class="panel hidden" data-panel="playback" role="tabpanel"></section>
        <section class="panel hidden" data-panel="look" role="tabpanel"></section>
        <section class="panel hidden" data-panel="media" role="tabpanel"></section>
      </div>
    </aside>

    <input id="videoFile" type="file" accept="video/*">
    <input id="srtFile" type="file" accept=".srt,application/x-subrip,text/plain">
    <input id="extFile" type="file" accept="video/*">
    <input id="skinFile" type="file" accept="image/*">
  </section>
</main>
<script type="module" src="js/main.js"></script>
</body>
</html>
