<!doctype html>
<!--
  Video Player — ambient video player for Android (Capacitor).

  The ambient-light engine (js/ambilight.js) is ported from youtube-ambilight by Wessel Kroos
  (MIT licence) — see THIRD_PARTY_NOTICES.md in the repository root.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Video Player</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/player.css">
<link rel="stylesheet" href="css/editors.css">
<link rel="stylesheet" href="css/sheet.css">
<link rel="stylesheet" href="css/gameboy.css">
</head>
<body>
<main class="app">
  <section class="stage" id="stage" aria-label="Video player">

    <!-- ===== Display: the window the video is shown in ===== -->
    <div class="video-wrap" id="videoWrap">
      <div class="layer ambient-layer" id="ambientLayer">
        <canvas id="stretchCv" aria-hidden="true"></canvas>
        <video id="extVideo" muted playsinline preload="auto" aria-hidden="true"></video>
        <div class="ambi" id="ambi" aria-hidden="true">
          <div class="ambi-filter" id="ambiFilter"><div class="ambi-proj" id="ambiProj"></div></div>
          <div class="ambi-noise" id="ambiNoise"></div>
        </div>
        <canvas class="mir" id="mirTop" aria-hidden="true"></canvas>
        <canvas class="mir" id="mirTopB" aria-hidden="true"></canvas>
        <canvas class="mir" id="mirBottom" aria-hidden="true"></canvas>
        <canvas class="mir" id="mirBottomB" aria-hidden="true"></canvas>
        <canvas class="mir" id="mirSide" aria-hidden="true"></canvas>
        <canvas class="mir" id="mirSideB" aria-hidden="true"></canvas>
      </div>

      <div class="layer fg-layer" id="fgLayer">
        <div class="fg-clip" id="fgClip"><video id="video" playsinline preload="metadata"></video></div>
      </div>
      <div class="video-vignette"></div>
      <i class="corner l" aria-hidden="true"></i><i class="corner r" aria-hidden="true"></i>

      <!-- touch surface: tap = play, double-tap = seek, pinch = zoom -->
      <div class="gestures" id="gestures"></div>
      <div class="flash" id="flash" aria-hidden="true"></div>

      <!-- crop editor: two vertical + two horizontal cut lines -->
      <div class="crop-editor hidden" id="cropEditor" aria-label="Crop editor">
        <div class="crop-shade" id="shT"></div><div class="crop-shade" id="shB"></div>
        <div class="crop-shade" id="shL"></div><div class="crop-shade" id="shR"></div>
        <div class="crop-box" id="cropBox"></div>
        <div class="crop-line h" id="lineT" data-edge="t" title="Drag to cut the top"></div>
        <div class="crop-line h" id="lineB" data-edge="b" title="Drag to cut the bottom"></div>
        <div class="crop-line v" id="lineL" data-edge="l" title="Drag to cut the left"></div>
        <div class="crop-line v" id="lineR" data-edge="r" title="Drag to cut the right"></div>
        <div class="editor-bar">
          <button class="pill" id="edAuto" type="button">Auto</button>
          <button class="pill" id="edReset" type="button">Reset</button>
          <button class="pill accent" id="edDone" type="button">Done</button>
        </div>
      </div>

      <!-- frame editor: move / zoom the video, resize the display -->
      <div class="adjust-editor hidden" id="adjustEditor" aria-label="Frame editor">
        <div class="adj-box" id="adjBox"></div>
        <div class="adj-cross" aria-hidden="true"></div>
        <div class="adj-hint" id="adjHint">Drag to move &middot; pinch to zoom</div>
        <div class="editor-bar">
          <button class="pill" id="adjFit" type="button">Fit</button>
          <button class="pill" id="adjFill" type="button">Fill</button>
          <button class="pill" id="adjReset" type="button">Reset</button>
          <button class="pill accent" id="adjDone" type="button">Done</button>
        </div>
        <div class="disp-handle" id="dispHandle" role="slider" aria-label="Display height" title="Drag to resize the display"><span></span></div>
      </div>

      <div class="upload-prompt" id="uploadPrompt">
        <div class="home-head">
          <h1 id="greeting">Good afternoon!</h1>
          <p>What are we watching?</p>
        </div>
        <div class="home-grid">
          <button class="home-card yellow" id="pickVideo" type="button">
            <span class="hc-title">Open video</span><span class="hc-sub">From your phone</span>
            <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M20 10v44l38-22z" fill="currentColor"/></svg>
          </button>
          <div class="home-col">
            <button class="home-card dark" id="pickExt" type="button"><span class="hc-title">Extended</span><span class="hc-sub">Background clip</span></button>
            <button class="home-card white" id="pickSrt" type="button"><span class="hc-title">Subtitles</span><span class="hc-sub">Add an .srt file</span></button>
          </div>
        </div>
      </div>

      <button class="play-overlay" id="bigPlay" type="button" aria-label="Play video"></button>
    </div>

    <!-- ===== Subtitles ===== -->
    <section class="text-section" id="subs" aria-label="Subtitles" aria-live="polite">
      <h2 id="subMain" dir="auto"></h2>
      <p class="description" id="description" dir="auto"></p>
      <button class="chip hidden" id="addSrt" type="button">＋ Add subtitles (SRT)</button>
    </section>

    <!-- ===== Controls: a little game pad. D-pad = skip + speed, reel = play / pause, round keys = player buttons ===== -->
    <section class="controls" id="controls" aria-label="Playback controls">
      <i class="skin" id="skin" aria-hidden="true"></i>

      <div class="utility-row">
        <button class="chip hidden" id="viewBadge" type="button" title="Reset zoom and position"></button>
      </div>

      <div class="seek-row">
        <span class="time" id="currentTime">0:00</span>
        <input id="seek" class="range" type="range" min="0" max="1000" value="0" aria-label="Seek video">
        <span class="time" id="duration">0:00</span>
      </div>

      <div class="pads">
      <svg class="wdefs" width="0" height="0" aria-hidden="true"><defs><linearGradient id="gCyan" gradientUnits="userSpaceOnUse" x1="60" y1="40" x2="340" y2="360"><stop offset="0" stop-color="#9af6ff"/><stop offset=".55" stop-color="#3fd6ee"/><stop offset="1" stop-color="#1798bd"/></linearGradient><linearGradient id="gViolet" gradientUnits="userSpaceOnUse" x1="60" y1="40" x2="340" y2="360"><stop offset="0" stop-color="#f6ecff"/><stop offset=".5" stop-color="#c79bff"/><stop offset="1" stop-color="#8650e0"/></linearGradient></defs></svg>
      <div class="well cyan">
        <button class="pad-btn petal" id="speedUp" type="button" aria-label="Faster" title="Faster">
          <svg viewBox="0 0 400 400" aria-hidden="true"><g class="pt"><path class="body" d="M225.57 134.84L293.03 67.37A162.00 162.00 0 0 0 106.97 67.37L174.43 134.84A70.00 70.00 0 0 1 225.57 134.84Z" stroke-width="40.00"/><g class="ico" transform="translate(200.0 72.0) scale(3.5) translate(-12 -12)"><path d="M12 5.2 19.2 18H4.8z"/></g></g></svg>
        </button>
        <button class="pad-btn petal" id="forward" type="button" aria-label="Forward 10 seconds" title="Forward 10 seconds">
          <svg viewBox="0 0 400 400" aria-hidden="true"><g class="pt"><path class="body" d="M265.16 225.57L332.63 293.03A162.00 162.00 0 0 0 332.63 106.97L265.16 174.43A70.00 70.00 0 0 1 265.16 225.57Z" stroke-width="40.00"/><g class="ico" transform="translate(328.0 174.0) scale(3.5) translate(-12 -12)"><circle cx="12" cy="12" r="7.2"/></g><text id="fwdLabel" class="lab" x="328.0" y="236.0" text-anchor="middle">10</text></g></svg>
        </button>
        <button class="pad-btn petal" id="speedDown" type="button" aria-label="Slower" title="Slower">
          <svg viewBox="0 0 400 400" aria-hidden="true"><g class="pt"><path class="body" d="M174.43 265.16L106.97 332.63A162.00 162.00 0 0 0 293.03 332.63L225.57 265.16A70.00 70.00 0 0 1 174.43 265.16Z" stroke-width="40.00"/><g class="ico" transform="translate(200.0 328.0) scale(3.5) translate(-12 -12)"><path d="M6 6l12 12M18 6 6 18"/></g></g></svg>
        </button>
        <button class="pad-btn petal" id="backward" type="button" aria-label="Back 10 seconds" title="Back 10 seconds">
          <svg viewBox="0 0 400 400" aria-hidden="true"><g class="pt"><path class="body" d="M134.84 174.43L67.37 106.97A162.00 162.00 0 0 0 67.37 293.03L134.84 225.57A70.00 70.00 0 0 1 134.84 174.43Z" stroke-width="40.00"/><g class="ico" transform="translate(72.0 174.0) scale(3.5) translate(-12 -12)"><rect x="5.2" y="5.2" width="13.6" height="13.6" rx="1.6"/></g><text id="backLabel" class="lab" x="72.0" y="236.0" text-anchor="middle">10</text></g></svg>
        </button>
        <svg class="core-svg" viewBox="0 0 400 400" aria-hidden="true"><text id="speedLabel" class="core" x="200" y="214" text-anchor="middle">1×</text></svg>
      </div>
      <div class="mid">
        <button class="reel-btn pill" id="playPause" type="button" aria-label="Play video">
          <svg class="pg" viewBox="-12 -12 24 24" aria-hidden="true"><path class="g-play" d="M-4.4 -6.2L6.4 0L-4.4 6.2Z"/><g class="g-pause"><rect x="-5.6" y="-6.4" width="4" height="12.8" rx="1.5"/><rect x="1.6" y="-6.4" width="4" height="12.8" rx="1.5"/></g></svg>
        </button>
        <button class="pad-btn pill" id="loopToggle" type="button" aria-pressed="false" aria-label="Loop video" title="Loop">
          <svg class="pg" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 2.5 20.5 6 17 9.5M3.5 11V9.5A3.5 3.5 0 0 1 7 6h13.5M7 21.5 3.5 18 7 14.5M20.5 13v1.5A3.5 3.5 0 0 1 17 18H3.5"/></svg>
        </button>
      </div>
      <div class="well violet">
        <button class="pad-btn petal" id="settingsToggle" type="button" aria-label="Settings" aria-expanded="false" title="Settings">
          <svg viewBox="0 0 400 400" aria-hidden="true"><g class="pt"><path class="body" d="M175.00 152.14L175.00 39.94A162.00 162.00 0 0 0 73.88 98.32L171.05 154.42A54.00 54.00 0 0 1 175.00 152.14Z" stroke-width="40.00"/><g class="ico" transform="translate(141.0 97.8) scale(3.5) translate(-12 -12)"><path d="M12 5.2 19.2 18H4.8z"/></g></g></svg>
        </button>
        <svg class="dec" viewBox="0 0 400 400" aria-hidden="true"><g class="pt"><path class="body" d="M228.95 154.42L287.25 120.76A97.20 97.20 0 0 0 226.58 85.73L226.58 153.05A32.40 32.40 0 0 1 228.95 154.42Z" stroke-width="20.00"/></g></svg>
        <button class="pad-btn petal" id="fsToggle" type="button" aria-label="Fullscreen" title="Fullscreen">
          <svg viewBox="0 0 400 400" aria-hidden="true"><g class="pt"><path class="body" d="M253.95 202.28L351.12 258.38A162.00 162.00 0 0 0 351.12 141.62L253.95 197.72A54.00 54.00 0 0 1 253.95 202.28Z" stroke-width="40.00"/><g class="ico" transform="translate(318.0 200.0) scale(3.5) translate(-12 -12)"><circle cx="12" cy="12" r="7.2"/></g><path id="fsPath" d="" style="display:none"/></g></svg>
        </button>
        <svg class="dec" viewBox="0 0 400 400" aria-hidden="true"><g class="pt"><path class="body" d="M225.00 247.86L225.00 315.18A97.20 97.20 0 0 0 285.67 280.15L227.37 246.50A32.40 32.40 0 0 1 225.00 247.86Z" stroke-width="20.00"/></g></svg>
        <button class="pad-btn petal" id="adjustToggle" type="button" aria-label="Move and zoom video" aria-pressed="false" title="Move and zoom video">
          <svg viewBox="0 0 400 400" aria-hidden="true"><g class="pt"><path class="body" d="M171.05 245.58L73.88 301.68A162.00 162.00 0 0 0 175.00 360.06L175.00 247.86A54.00 54.00 0 0 1 171.05 245.58Z" stroke-width="40.00"/><g class="ico" transform="translate(141.0 302.2) scale(3.5) translate(-12 -12)"><rect x="5.2" y="5.2" width="13.6" height="13.6" rx="1.6"/></g></g></svg>
        </button>
        <svg class="dec" viewBox="0 0 400 400" aria-hidden="true"><g class="pt"><path class="body" d="M146.05 197.72L87.75 164.06A97.20 97.20 0 0 0 87.75 234.11L146.05 200.46A32.40 32.40 0 0 1 146.05 197.72Z" stroke-width="20.00"/></g></svg>
      </div>
      </div>
    </section>

    <!-- ===== Settings sheet ===== -->
    <aside class="sheet" id="sheet" aria-label="Settings" aria-hidden="true">
      <div class="sheet-grab" aria-hidden="true"></div>
      <header class="sheet-head">
        <nav class="tabs" id="tabs" role="tablist" aria-label="Settings sections">
          <button role="tab" type="button" data-tab="top" aria-selected="false">Top</button>
          <button role="tab" type="button" data-tab="video" aria-selected="true">Video</button>
          <button role="tab" type="button" data-tab="bottom" aria-selected="false">Bottom</button>
          <button role="tab" type="button" data-tab="presets" aria-selected="false">Presets</button>
          <button role="tab" type="button" data-tab="playback" aria-selected="false">Playback</button>
          <button role="tab" type="button" data-tab="look" aria-selected="false">Look</button>
          <button role="tab" type="button" data-tab="media" aria-selected="false">Media</button>
        </nav>
        <button class="icon-btn small" id="sheetClose" type="button" aria-label="Close settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div class="sheet-body" id="sheetBody">
        <section class="panel hidden" data-panel="top" role="tabpanel"></section>
        <section class="panel" data-panel="video" role="tabpanel"></section>
        <section class="panel hidden" data-panel="bottom" role="tabpanel"></section>
        <section class="panel hidden" data-panel="presets" role="tabpanel"></section>
        <section class="panel hidden" data-panel="playback" role="tabpanel"></section>
        <section class="panel hidden" data-panel="look" role="tabpanel"></section>
        <section class="panel hidden" data-panel="media" role="tabpanel"></section>
      </div>
    </aside>

    <input id="videoFile" type="file" accept="video/*">
    <input id="srtFile" type="file" accept=".srt,application/x-subrip,text/plain">
    <input id="extFile" type="file" accept="video/*">
    <input id="skinFile" type="file" accept="image/*">
  </section>
</main>
<script type="module" src="js/main.js"></script>
</body>
</html>
